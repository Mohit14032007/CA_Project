model:
  model_name: mixtral

system:
  gpu_gen: H100
  nvlink_gen: 5
  infiniband_gen: 800
  num_node: 1
  num_device: 4
  processor_type: GPU
  distribution:
    none_expert_tensor_degree: 4
    expert_tensor_degree: 1
  optimization:
    parallel_execution: off
    hetero_subbatch: off
    disagg_system: off
    use_low_unit_moe_only: off
    use_ramulator: off
    compressed_kv: on
    use_absorb: on
    use_flash_mla: on
    use_flash_attention: on
    reuse_kv_cache: on
    kv_cache_reuse_rate: 0.0
    prefill_mode: off
    decode_mode: on

serving:
  max_batch_size: 32
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 2048
  output_len: 128
  precision_byte: 2
  skewness: 0.0
  iter: 1
  injection_rate: 0
  exit_out_of_memory: off
  mem_cap_limit: off

log:
  print_log: on
  export_gantt: on
  output_directory: reproduction/results/csv/debug_gpu_baseline/
  gantt_directory: reproduction/results/raw/debug_gpu_baseline/
