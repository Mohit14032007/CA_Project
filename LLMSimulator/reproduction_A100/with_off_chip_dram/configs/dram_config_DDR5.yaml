Frontend:
  impl: PIMController
  clock_ratio: 1
  path: example_inst.trace 

MemorySystem:
  impl: PIMDRAMSystem
  clock_ratio: 1

  DRAM:
    impl: DDR5
    org:
      preset: DDR5_32Gb_x16
      channel: 2
      rank: 2
    timing:
      preset: DDR5_3200BN
    RFM:
      BRC: 2

  Controller:
    impl: PIM_DRAM_controller
    Scheduler:
      impl: PIM_Scheduler
    RefreshManager:
      impl: AllBank
    plugins:
    - ControllerPlugin:
        impl: TraceRecorder
        path: log/cmd_ddr5.log

  AddrMapper:
    impl: RoBaRaCoCh
