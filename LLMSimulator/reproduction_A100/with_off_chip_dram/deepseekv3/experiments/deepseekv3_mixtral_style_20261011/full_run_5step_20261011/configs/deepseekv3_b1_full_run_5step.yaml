# DS-6C-4: DeepSeek-V3 Full-Depth 5-Step Controlled MoE Memory-System Profile
# Architecture: 60 layers (3 dense + 57 MoE layers), 256 routed experts/layer, top-8, 1 shared expert
# Precision: FP16 accounting (precision_byte: 2)
# Cache: 80 GB (80,000,000,000 bytes) LRU cache in HBM3 backing 2.75 TB DDR5
# Workload: batch size 1, input_len 2048, output_len 10, sequential decoding steps: 5 (iter: 5)
# Output directories strictly isolated under full_run_5step_20261011/

model:
  model_name: deepseekV3
  num_layers: 60

system:
  gpu_gen: A100
  nvlink_gen: 3
  infiniband_gen: 800
  num_node: 1
  num_device: 1
  processor_type: GPU
  distribution:
    none_expert_tensor_degree: 1
    expert_tensor_degree: 1
  optimization:
    parallel_execution: 'off'
    hetero_subbatch: false
    disagg_system: false
    use_low_unit_moe_only: false
    use_ramulator: 'on'
    offchip_dram_cfg_path: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/full_run_5step_20261011/config_snapshot/dram_config_DDR5_retry.yaml
    hbm_dram_cfg_path: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/full_run_5step_20261011/config_snapshot/dram_config_HBM3_80GB.yaml
    expert_cache_capacity_bytes: 80000000000
    compressed_kv: true
    use_absorb: true
    use_flash_mla: true
    use_flash_attention: true
    reuse_kv_cache: true
    kv_cache_reuse_rate: 0.0
    prefill_mode: false
    decode_mode: true
    use_hitting_queue: false

serving:
  max_batch_size: 1
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 2048
  output_len: 10
  precision_byte: 2
  skewness: 0.0
  iter: 5
  injection_rate: 0
  exit_out_of_memory: false
  mem_cap_limit: false

log:
  print_log: true
  export_gantt: false
  output_directory: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/full_run_5step_20261011/csv/
  gantt_directory: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/full_run_5step_20261011/raw/
  traces_directory: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/full_run_5step_20261011/traces/
