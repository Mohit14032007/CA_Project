# DeepSeek-V3 Authoritative Experiment Configuration (Mixtral-Style B1 Full Workflow)
# Experiment Directory: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/
# Base Commit: f75d362ae157f81ef2d3bd4055c9b22e34882a9f
# Model: DeepSeek-V3 (60 Layers: 3 Dense + 57 MoE, Top-8, 256 Routed Experts, 1 Shared Expert)
# Precision: FP16 (precision_byte: 2) -> 88.08 MB per expert
# Memory: Single A100 Reference (80 GB Local HBM Cache + 2.75 TB Off-Chip DDR5 Backing Store)

model:
  model_name: deepseekV3

system:
  gpu_gen: A100
  nvlink_gen: 3
  infiniband_gen: 800
  num_node: 1
  num_device: 1
  processor_type: GPU
  distribution:
    none_expert_tensor_degree: 1
    expert_tensor_degree: 1
  optimization:
    parallel_execution: 'off'
    hetero_subbatch: false
    disagg_system: false
    use_low_unit_moe_only: false
    use_ramulator: 'on'
    offchip_dram_cfg_path: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/config_snapshot/dram_config_DDR5_retry.yaml
    hbm_dram_cfg_path: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/config_snapshot/dram_config_HBM3_80GB.yaml
    expert_cache_capacity_bytes: 80000000000 # 80 GB Local HBM Cache
    compressed_kv: true
    use_absorb: true
    use_flash_mla: true
    use_flash_attention: true
    reuse_kv_cache: true
    kv_cache_reuse_rate: 0.0
    prefill_mode: false
    decode_mode: true
    use_hitting_queue: false

serving:
  max_batch_size: 1
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 2048
  output_len: 10
  precision_byte: 2
  skewness: 0.0
  iter: 5
  injection_rate: 0
  exit_out_of_memory: false
  mem_cap_limit: false

log:
  print_log: true
  export_gantt: false
  output_directory: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/csv/
  gantt_directory: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/raw/
  traces_directory: reproduction_A100/with_off_chip_dram/deepseekv3/experiments/deepseekv3_mixtral_style_20261011/traces/
